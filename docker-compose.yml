# the sidecars start by default. postgres and redis are opt-in via the "local-db"
# profile: dev normally points DATABASE_URL/REDIS_URL at the railway instances, but
# these stay here for working offline or when railway is unavailable.
#   docker compose up -d                        -> validator + converter only
#   docker compose --profile local-db up -d     -> also postgres + redis
services:
  postgres:
    image: postgres:16-alpine
    container_name: fhirfix-postgres
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: fhirfix
      POSTGRES_PASSWORD: fhirfix
      POSTGRES_DB: fhirfix
    ports:
      - "5434:5432"
    volumes:
      - fhirfix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhirfix -d fhirfix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fhirfix-redis
    profiles: ["local-db"]
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - fhirfix-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HL7 FHIR validator behind the Inferno wrapper. Warm instance; the engine
  # loads US Core 6.1.0 at boot via PUT /igs and ready-gates on GET /igs.
  # Terminology validation resolves against the public tx.fhir.org by default.
  validator:
    image: infernocommunity/fhir-validator-service:v2.3.6
    container_name: fhirfix-validator
    restart: unless-stopped
    ports:
      - "4567:4567"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4567/igs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Microsoft FHIR-Converter for HL7v2/C-CDA -> FHIR R4. convertToFhir API.
  converter:
    image: mcr.microsoft.com/healthcareapis/fhir-converter:1.0.476-preview
    container_name: fhirfix-converter
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      # the converter image ships curl but not wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Inferno Plan-Net test kit for phase-7 conformance packets. Opt-in because the
  # image is ~2GB and only the conformance feature needs it. Build it first with
  # scripts/build-inferno.sh, which clones the kit at the pinned tag.
  inferno:
    image: fhirfix-inferno-plannet:v0.13.4
    container_name: fhirfix-inferno
    profiles: ["conformance"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://inferno-redis:6379/0
      APP_ENV: production
    ports:
      - "4568:4567"
    volumes:
      - fhirfix-infernodata:/opt/inferno/data
    depends_on:
      - inferno-redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4567/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # inferno runs its tests through sidekiq, so the web container alone accepts a
  # run and then never executes it
  inferno-worker:
    image: fhirfix-inferno-plannet:v0.13.4
    container_name: fhirfix-inferno-worker
    profiles: ["conformance"]
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-r", "./worker.rb"]
    environment:
      REDIS_URL: redis://inferno-redis:6379/0
      APP_ENV: production
    volumes:
      - fhirfix-infernodata:/opt/inferno/data
    depends_on:
      - inferno-redis

  inferno-redis:
    image: redis:7-alpine
    container_name: fhirfix-inferno-redis
    profiles: ["conformance"]
    restart: unless-stopped

  # inferno validates resources against this, separate from the app's validator
  inferno-validator:
    image: infernocommunity/inferno-resource-validator
    container_name: fhirfix-inferno-validator
    profiles: ["conformance"]
    restart: unless-stopped
    environment:
      SESSION_CACHE_DURATION: -1

volumes:
  fhirfix-pgdata:
  fhirfix-redisdata:
  fhirfix-infernodata:
